[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-and-return-research"
version = "0.2.0"
description = "Offline, reproducible portfolio comparisons with explicit data and cost assumptions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2"]

[project.optional-dependencies]
notebook = ["matplotlib>=3.8,<4", "nbformat>=5.10,<6", "jupyterlab>=4,<5"]

[project.scripts]
risk-return = "risk_return.cli:main"

[tool.setuptools.packages.find]
include = ["risk_return*"]

[project.urls]
Repository = "https://github.com/ftrupp/Risk-and-Return"
